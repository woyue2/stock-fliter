<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MACD金叉+放量突破</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            font-size: 13px;
            color: #333;
            background: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .left-panel {
            width: 35%;
            min-width: 400px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e0e0e0;
        }
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fafafa;
        }
        .right-header {
            padding: 10px 16px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stock-frame {
            flex: 1;
            border: none;
            width: 100%;
        }
        .placeholder {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
        }
        .header {
            padding: 16px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title {
            font-size: 16px;
            font-weight: 600;
        }
        .count {
            color: #666;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn {
            padding: 6px 12px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn:hover {
            background: #f5f5f5;
        }
        .search {
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 150px;
        }
        .stats {
            padding: 12px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .stats-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .stats-label {
            font-size: 12px;
            color: #999;
            margin-right: 4px;
        }
        .tag {
            font-size: 11px;
            padding: 2px 6px;
            background: #f0f0f0;
            border-radius: 3px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #fafafa;
            font-weight: 500;
            position: sticky;
            top: 0;
        }
        tr:hover {
            background: #f9f9f9;
        }
        tr.checked {
            background: #e8f5e9;
        }
        .code {
            color: #1976d2;
            text-decoration: none;
        }
        .code:hover {
            text-decoration: underline;
        }
        .td {
            font-weight: 600;
            text-align: center;
        }
        .td-high { color: #d32f2f; }
        .td-mid { color: #f57c00; }
        .td-low { color: #999; }
        .macd-strength {
            text-align: center;
            font-weight: 600;
        }
        .detail {
            font-size: 11px;
            color: #1976d2;
        }
        .table-wrap {
            overflow: auto;
            flex: 1;
        }
        .checked-info {
            font-size: 12px;
            color: #4caf50;
        }
        .open-new {
            font-size: 11px;
            color: #1976d2;
            text-decoration: none;
            cursor: pointer;
        }
        .open-new:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="left-panel">
        <div class="header">
        <div>
            <span class="title">MACD金叉+放量突破</span>
            <span class="count">共 1 只</span>
        </div>
        <div class="toolbar">
            <span class="checked-info" id="checkedInfo">已选 0</span>
            <button class="btn" onclick="selectAll()">全选</button>
            <button class="btn" onclick="clearAll()">清除</button>
            <button class="btn" onclick="exportCSV()">导出</button>
            <input type="text" class="search" placeholder="搜索..." oninput="filterTable(this.value)">
        </div>
    </div>
    
    <div class="stats">
        <div class="stats-group">
            <span class="stats-label">板块:</span>
            <span class="tag">上海主板 1</span>
        </div>
        <div class="stats-group">
            <span class="stats-label">行业:</span>
            <span class="tag">G59装卸搬运和仓储业 1</span>
        </div>
    </div>
    
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th width="30"></th>
                    <th>代码</th>
                    <th>名称</th>
                    <th>板块</th>
                    <th>行业</th>
                    <th>最新收盘</th>
                    <th>最新日期</th>
                    <th>MAxRSIx6U1D</th>
                    <th>放量突破</th>
                    <th>MACD金叉</th>
                    <th>MACD强度</th>
                    <th>TD计数</th>
                    <th>所属策略</th>
                </tr>
            </thead>
            <tbody id="tbody">
                
            <tr data-code="600794">
                <td><input type="checkbox" class="check" data-code="600794" onchange="saveChecked()"></td>
                <td><a href="javascript:void(0)" onclick="showStock('https://quote.eastmoney.com/sh600794.html')" class="code">600794</a></td>
                <td>保税科技</td>
                <td>上海主板</td>
                <td>G59装卸搬运和仓储业</td>
                <td>4.13</td>
                <td>2026-02-26</td>
                <td></td>
                <td>✅</td>
                <td></td>
                <td class="macd-strength"><span style="color: #999;">-0.0049</span></td>
                <td class="td td-low">0</td>
                <td class="detail">MACD金叉+放量突破,非MAxRSIx6U1D+MACD金叉,TD9或MACD金叉</td>
            </tr>
            
            </tbody>
        </table>
    </div>
    </div>
    
    <div class="right-panel">
        <div class="right-header">
            <span id="stockTitle">点击左侧股票代码查看详情</span>
            <a id="openNew" class="open-new" style="display:none" onclick="window.open(currentUrl)" title="新窗口打开">↗ 新窗口</a>
        </div>
        <div class="placeholder" id="placeholder">← 选择股票查看行情</div>
        <iframe id="stockFrame" class="stock-frame" style="display:none"></iframe>
    </div>
    
    <script>
        const STORAGE_KEY = 'new_strategy_MACD金叉+放量突破';
        let currentUrl = '';
        
        // 初始化
        document.addEventListener('DOMContentLoaded', loadChecked);
        
        function loadChecked() {
            const checked = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            checked.forEach(code => {
                const cb = document.querySelector(`input[data-code="${code}"]`);
                if (cb) {
                    cb.checked = true;
                    cb.closest('tr').classList.add('checked');
                }
            });
            updateInfo();
        }
        
        function saveChecked() {
            const checked = [];
            document.querySelectorAll('.check:checked').forEach(cb => {
                checked.push(cb.dataset.code);
                cb.closest('tr').classList.add('checked');
            });
            document.querySelectorAll('.check:not(:checked)').forEach(cb => {
                cb.closest('tr').classList.remove('checked');
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(checked));
            updateInfo();
            
            // 通知父窗口更新已选股票列表
            try {
                window.parent.addSelectedStockFromChild(checked);
            } catch (e) {}
        }
        
        // 供父窗口调用：更新当前页面的勾选状态
        function updateSelectionFromParent(selectedCodes) {
            document.querySelectorAll('.check').forEach(cb => {
                const isChecked = selectedCodes.includes(cb.dataset.code);
                cb.checked = isChecked;
                if (isChecked) {
                    cb.closest('tr').classList.add('checked');
                } else {
                    cb.closest('tr').classList.remove('checked');
                }
            });
            updateInfo();
        }
        
        // 供父窗口调用：移除勾选
        function removeStockSelection(code) {
            const cb = document.querySelector(`input[data-code="${code}"]`);
            if (cb) {
                cb.checked = false;
                cb.closest('tr').classList.remove('checked');
            }
            saveChecked();
        }
        
        function updateInfo() {
            const count = document.querySelectorAll('.check:checked').length;
            document.getElementById('checkedInfo').textContent = '已选 ' + count;
        }
        
        function selectAll() {
            document.querySelectorAll('.check').forEach(cb => cb.checked = true);
            saveChecked();
        }
        
        function clearAll() {
            document.querySelectorAll('.check').forEach(cb => cb.checked = false);
            saveChecked();
        }
        
        function exportCSV() {
            const rows = [['代码', '名称']];
            document.querySelectorAll('.check:checked').forEach(cb => {
                const tr = cb.closest('tr');
                rows.push([cb.dataset.code, tr.cells[2].textContent]);
            });
            if (rows.length === 1) { alert('请先选择股票'); return; }
            const csv = rows.map(r => r.join(',')).join('\n');
            const blob = new Blob(['\ufeff' + csv], {type: 'text/csv'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'MACD金叉+放量突破.csv';
            a.click();
        }
        
        function filterTable(keyword) {
            keyword = keyword.toLowerCase();
            document.querySelectorAll('#tbody tr').forEach(tr => {
                tr.style.display = tr.textContent.toLowerCase().includes(keyword) ? '' : 'none';
            });
        }
        
        function showStock(url) {
            currentUrl = url;
            const code = url.match(/([a-z]+\d+)\.html/)[1];
            document.getElementById('stockTitle').textContent = code.toUpperCase();
            document.getElementById('openNew').style.display = 'inline';
            document.getElementById('placeholder').style.display = 'none';
            const frame = document.getElementById('stockFrame');
            frame.style.display = 'block';
            frame.src = url;
        }
    </script>
</body>
</html>
