<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量化雷达终端 V4.0 | 多维视觉实验室</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500;800&family=Noto+Serif+SC:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --panel: rgba(20, 20, 20, 0.8);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #00F59B;
            --text-main: #FFFFFF;
            --text-dim: #737373;
            --shadow: 0 0 0 rgba(0,0,0,0);
        }

        /* 主题定义 */
        [data-theme="cyber"] {
            --bg: #030308;
            --panel: rgba(10, 10, 30, 0.9);
            --border: #00F59B33;
            --accent: #00F59B;
            --text-main: #00F59B;
            --text-dim: #008855;
            --shadow: 0 0 20px rgba(0, 245, 155, 0.3);
        }
        [data-theme="paper"] {
            --bg: #F5F2EA;
            --panel: #FFFFFF;
            --border: #000000;
            --accent: #D32F2F;
            --text-main: #000000;
            --text-dim: #666666;
            --shadow: 4px 4px 0px 0px rgba(0,0,0,1);
        }
        [data-theme="glass"] {
            --bg: linear-gradient(135deg, #1a1c2c 0%, #4a192c 100%);
            --panel: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.2);
            --accent: #FFD700;
            --text-main: #FFFFFF;
            --text-dim: rgba(255, 255, 255, 0.6);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        [data-theme="matrix"] {
            --bg: #000000;
            --panel: "none";
            --border: #00FF41;
            --accent: #00FF41;
            --text-main: #00FF41;
            --text-dim: #003B00;
            --shadow: 0 0 10px #00FF41;
        }
        [data-theme="luxury"] {
            --bg: #121212;
            --panel: #1A1A1A;
            --border: #C19A6B;
            --accent: #C19A6B;
            --text-main: #F5F5F5;
            --text-dim: #555555;
            --shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        [data-theme="swiss"] {
            --bg: #FFFFFF;
            --panel: #000000;
            --border: #000000;
            --accent: #0051FF;
            --text-main: #000000;
            --text-dim: #999999;
            --shadow: 0 0 0 rgba(0,0,0,0);
        }

        body { 
            background: var(--bg); 
            color: var(--text-main); 
            transition: all 0.5s ease;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        
        .polar-grid {
            background-image: radial-gradient(circle, var(--border) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: center;
        }

        .sector-node {
            position: absolute;
            transform: translate(-50%, -50%);
            transition: all 0.8s cubic-bezier(0.2, 1, 0.2, 1);
        }

        .arc-path {
            fill: none;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 2s forwards ease-out;
            filter: drop-shadow(var(--shadow));
        }

        @keyframes draw { to { stroke-dashoffset: 0; } }

        .glass-blur { backdrop-filter: blur(12px); }
        
        /* 核心动画 */
        .hub-rotate { animation: rotate 20s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .btn-theme {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 800;
            border: 1px solid var(--border);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .btn-theme:hover { background: var(--text-main); color: var(--bg); }
        .btn-theme.active { background: var(--accent); color: #000; border-color: var(--accent); }
    </style>
</head>
<body class="h-screen w-full flex flex-col overflow-hidden selection:bg-white selection:text-black">

    <!-- 顶部导航 -->
    <header class="flex-none px-6 py-4 z-50 flex justify-between items-end border-b border-[var(--border)] bg-gray-900/10 glass-blur">
        <div>
            <div class="flex items-center gap-2 mb-1">
                <div class="w-1.5 h-1.5 rounded-full bg-[var(--accent)] shadow-[0_0_10px_var(--accent)]"></div>
                <span class="text-[9px] font-mono uppercase tracking-[0.4em] text-[var(--text-dim)]">Visual Lab V4.0</span>
            </div>
            <h1 class="text-2xl font-black flex items-center gap-3">
                <span id="page-title">恐慌错杀报告</span>
                <span id="page-index" class="font-mono text-[var(--accent)] text-xs opacity-50">/01</span>
            </h1>
        </div>
        
        <!-- 主题切换器 -->
        <div class="flex gap-2 mb-1" id="theme-switcher">
            <button class="btn-theme active" onclick="setTheme('cyber')">Cyber</button>
            <button class="btn-theme" onclick="setTheme('paper')">Paper</button>
            <button class="btn-theme" onclick="setTheme('glass')">Glass</button>
            <button class="btn-theme" onclick="setTheme('matrix')">Matrix</button>
            <button class="btn-theme" onclick="setTheme('luxury')">Luxury</button>
            <button class="btn-theme" onclick="setTheme('swiss')">Swiss</button>
        </div>
    </header>

    <!-- 主布景 -->
    <main class="flex-1 relative flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 polar-grid opacity-30"></div>
        
        <!-- 中央核心：多重环绕 -->
        <div class="relative z-20 flex items-center justify-center">
            <div class="absolute w-64 h-64 border border-[var(--border)] rounded-full opacity-20 hub-rotate"></div>
            <div class="absolute w-56 h-56 border-t-2 border-[var(--accent)] rounded-full opacity-40 hub-rotate" style="animation-direction: reverse;"></div>
            
            <div class="w-44 h-44 rounded-full glass-blur flex flex-col items-center justify-center border-2 border-[var(--border)] shadow-[var(--shadow)] bg-[var(--panel)]">
                <div class="text-[10px] font-mono text-[var(--text-dim)] mb-1 uppercase tracking-[0.5em]">SENTIMENT</div>
                <div id="central-value" class="text-4xl font-black font-mono tracking-tighter text-[var(--accent)]">52.4%</div>
                <div class="w-20 h-[4px] bg-[var(--border)] mt-4 rounded-full overflow-hidden">
                    <div id="central-bar" class="h-full bg-[var(--accent)] w-1/2 transition-all duration-1000"></div>
                </div>
            </div>
        </div>

        <svg id="radial-svg" class="absolute inset-0 w-full h-full z-10" viewBox="0 0 400 400"></svg>
        <div id="nodes-container" class="absolute inset-0 z-30 pointer-events-none"></div>
    </main>

    <!-- 底部控制 -->
    <footer class="flex-none p-8 z-50 border-t border-[var(--border)] bg-gray-900/10 glass-blur">
        <div class="flex justify-around items-center max-w-sm mx-auto">
            <button onclick="switchPage(0)" class="nav-btn group flex flex-col items-center gap-3">
                <div class="w-12 h-[2px] bg-[var(--border)] group-[.active]:bg-[var(--accent)] group-[.active]:h-[4px] transition-all"></div>
                <span class="text-[11px] font-black tracking-[0.2em] text-[var(--text-dim)] group-[.active]:text-[var(--text-main)]">策略狙击</span>
            </button>
            <button onclick="switchPage(1)" class="nav-btn group flex flex-col items-center gap-3">
                <div class="w-12 h-[2px] bg-[var(--border)] group-[.active]:bg-[var(--accent)] group-[.active]:h-[4px] transition-all"></div>
                <span class="text-[11px] font-black tracking-[0.2em] text-[var(--text-dim)] group-[.active]:text-[var(--text-main)]">核心持仓</span>
            </button>
            <button onclick="switchPage(2)" class="nav-btn group flex flex-col items-center gap-3">
                <div class="w-12 h-[2px] bg-[var(--border)] group-[.active]:bg-[var(--accent)] group-[.active]:h-[4px] transition-all"></div>
                <span class="text-[11px] font-black tracking-[0.2em] text-[var(--text-dim)] group-[.active]:text-[var(--text-main)]">避险雷达</span>
            </button>
        </div>
    </footer>

    <script>
        const data = [
            { title: "恐慌错杀监测", color: "#00F59B", sentiment: "52.4%", items: [
                { name: "环境治理", val: "-3.11" }, { name: "零售板块", val: "-2.61" }, { name: "教育行业", val: "-2.37" },
                { name: "非金属类", val: "-1.88" }, { name: "塑料制品", val: "-1.14" }, { name: "纺织制造", val: "-1.05" }
            ]},
            { title: "主力典型洗盘", color: "#40A9FF", sentiment: "48.2%", items: [
                { name: "电网设备", val: "-0.21" }, { name: "电力能源", val: "+0.85" }, { name: "自动化", val: "+0.50" },
                { name: "中药板块", val: "+0.26" }, { name: "消费电子", val: "-0.16" }, { name: "美容护理", val: "+0.38" },
                { name: "旅游酒店", val: "-0.59" }, { name: "影视院线", val: "+0.99" }, { name: "IT服务", val: "-0.77" }
            ]},
            { title: "诱多预警陷阱", color: "#FF4D6D", sentiment: "35.1%", items: [
                { name: "电池行业", val: "+1.14" }, { name: "通用设备", val: "+1.37" }, { name: "厨卫电器", val: "+2.03" },
                { name: "黑色家电", val: "+3.41" }, { name: "港口航运", val: "+0.88" }, { name: "软件开发", val: "+2.45" }
            ]}
        ];

        let currentTheme = 'cyber';

        function setTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            currentTheme = theme;
            document.querySelectorAll('.btn-theme').forEach(b => {
                b.classList.remove('active');
                if(b.innerText.toLowerCase() === theme) b.classList.add('active');
            });
            // 重新渲染当前页以应用主题色
            const activeIdx = Array.from(document.querySelectorAll('.nav-btn')).findIndex(b => b.classList.contains('active'));
            switchPage(activeIdx === -1 ? 0 : activeIdx);
        }

        function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
            const rad = (angleInDegrees - 90) * Math.PI / 180.0;
            return { x: centerX + (radius * Math.cos(rad)), y: centerY + (radius * Math.sin(rad)) };
        }

        function describeArc(x, y, radius, startAngle, endAngle) {
            const start = polarToCartesian(x, y, radius, endAngle);
            const end = polarToCartesian(x, y, radius, startAngle);
            const flag = endAngle - startAngle <= 180 ? "0" : "1";
            return ["M", start.x, start.y, "A", radius, radius, 0, flag, 0, end.x, end.y].join(" ");
        }

        function switchPage(idx) {
            const p = data[idx];
            document.getElementById('page-title').innerText = p.title;
            document.getElementById('page-index').innerText = `/${(idx+1).toString().padStart(2, '0')}`;
            document.getElementById('central-value').innerText = p.sentiment;
            
            // 根据主题和数据动态覆盖颜色
            const accentColor = (currentTheme === 'cyber' || currentTheme === 'matrix' || currentTheme === 'swiss') ? p.color : 'var(--accent)';
            document.getElementById('central-value').style.color = accentColor;
            document.getElementById('central-bar').style.backgroundColor = accentColor;
            document.getElementById('central-bar').style.width = p.sentiment;

            document.querySelectorAll('.nav-btn').forEach((btn, i) => {
                if(i === idx) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            const svg = document.getElementById('radial-svg');
            svg.innerHTML = '';
            const container = document.getElementById('nodes-container');
            container.innerHTML = '';

            const n = p.items.length;
            p.items.forEach((item, i) => {
                const angle = (360 / n) * i;
                const dist = 100 + (i % 2) * 50; 

                // 轨道
                const arc = document.createElementNS("http://www.w3.org/2000/svg", "path");
                arc.setAttribute("d", describeArc(200, 200, dist, angle - 10, angle + 10));
                arc.setAttribute("class", "arc-path");
                arc.setAttribute("stroke", accentColor);
                arc.setAttribute("stroke-width", Math.min(15, Math.abs(parseFloat(item.val)) * 5));
                arc.setAttribute("opacity", "0.4");
                svg.appendChild(arc);

                // 节点
                const pos = polarToCartesian(50, 50, dist / 4, angle);
                const node = document.createElement('div');
                node.className = 'sector-node pointer-events-auto';
                node.style.left = `${pos.x}%`;
                node.style.top = `${pos.y}%`;
                
                const labelStyle = currentTheme === 'paper' ? 'border-2 border-black bg-white shadow-[4px_4px_0_black]' : 
                                  currentTheme === 'glass' ? 'bg-white/10 backdrop-blur-md border border-white/20' :
                                  currentTheme === 'luxury' ? 'bg-[#1A1A1A] border border-[#C19A6B] shadow-lg' :
                                  'bg-white text-black shadow-xl';

                const textCol = (currentTheme === 'cyber' || currentTheme === 'matrix') ? 'text-black' : 
                               currentTheme === 'paper' ? 'text-black' : 
                               currentTheme === 'glass' ? 'text-white' : 'text-white';
                
                node.innerHTML = `
                    <div class="flex flex-col items-center">
                        <div class="${labelStyle} px-3 py-1 rounded-sm">
                            <span class="text-[12px] font-black whitespace-nowrap ${currentTheme === 'paper' || currentTheme === 'swiss' ? 'text-black' : currentTheme === 'glass' ? 'text-white' : 'text-white'}">${item.name}</span>
                        </div>
                        <div class="text-[11px] font-bold mt-1 px-1 bg-black/80 rounded" style="color: ${accentColor}">${item.val}</div>
                    </div>
                `;
                container.appendChild(node);
            });
        }

        // 默认初始化
        setTheme('cyber');
    </script>
</body>
</html>
