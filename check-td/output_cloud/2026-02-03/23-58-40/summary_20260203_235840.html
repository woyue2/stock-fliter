<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TD分析分析报告 - 2026-02-03</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }
        .layout {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 200px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }
        .logo {
            padding: 20px;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            border-bottom: 1px solid #e0e0e0;
        }
        .nav {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }
        .nav-group {
            padding: 12px 20px 6px;
            font-size: 12px;
            color: #999;
            font-weight: 500;
        }
        .nav-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-item:hover {
            background: #f5f5f5;
        }
        .nav-item.active {
            background: #e3f2fd;
            color: #1976d2;
        }
        .level-name {
            font-size: 14px;
        }
        .level-count {
            font-size: 12px;
            background: #e0e0e0;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .nav-item.active .level-count {
            background: #1976d2;
            color: #fff;
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .content {
            flex: 1;
            background: #fff;
        }
        .content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <div class="logo">📊 TD分析分析报告</div>
            <div class="nav">
                <div class="nav-group">8底</div>
                    <div class="nav-item " data-level="日8底" onclick="showLevel('日8底')">
                        <span class="level-name">日8底</span>
                        <span class="level-count">1</span>
                    </div>
                    <div class="nav-group">7底</div>
                    <div class="nav-item active" data-level="日7底" onclick="showLevel('日7底')">
                        <span class="level-name">日7底</span>
                        <span class="level-count">1</span>
                    </div>
                    
            </div>
        </div>
        <div class="main">
            <div class="content" id="content">
                <iframe src="日7底.html"></iframe>
            </div>
        </div>
    </div>
    
    <script>
        const availableLevels = ["日7底", "日8底"];
        
        function showLevel(level) {
            // 更新导航状态
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.level === level) {
                    item.classList.add('active');
                }
            });
            
            // 更新 iframe
            if (availableLevels.includes(level)) {
                document.getElementById('content').innerHTML = 
                    `<iframe src="${level}.html"></iframe>`;
            } else {
                alert('暂无 ' + level + ' 的数据');
            }
        }
    </script>
</body>
</html>
