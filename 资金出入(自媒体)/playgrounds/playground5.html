<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量化雷达终端 V5.0 | 径向视觉实验室</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@500;800&display=swap"
        rel="stylesheet">
    <style>
        /* ===== 主题系统 ===== */
        :root {
            --bg: #050505;
            --panel: rgba(20, 20, 20, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #00F59B;
            --text-main: #FFFFFF;
            --text-dim: #737373;
            --node-bg: #FFFFFF;
            --node-text: #000000;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        /* 1. 赛博暗夜 */
        [data-theme="cyber"] {
            --bg: #030308;
            --panel: rgba(10, 10, 30, 0.9);
            --border: rgba(0, 245, 155, 0.15);
            --accent: #00F59B;
            --text-main: #E0FFF0;
            --text-dim: #2A7A55;
            --node-bg: #0A2018;
            --node-text: #00F59B;
            --shadow: 0 0 25px rgba(0, 245, 155, 0.15);
        }

        /* 2. 复古纸本 */
        [data-theme="paper"] {
            --bg: #F5F2EA;
            --panel: #FFFFFF;
            --border: #1A1A1A;
            --accent: #C0392B;
            --text-main: #1A1A1A;
            --text-dim: #888888;
            --node-bg: #FFFFFF;
            --node-text: #1A1A1A;
            --shadow: 3px 3px 0px 0px #1A1A1A;
        }

        /* 3. 毛玻璃幻彩 */
        [data-theme="glass"] {
            --bg: #1a1c2c;
            --panel: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.15);
            --accent: #FFD700;
            --text-main: #FFFFFF;
            --text-dim: rgba(255, 255, 255, 0.45);
            --node-bg: rgba(255, 255, 255, 0.12);
            --node-text: #FFFFFF;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        /* 4. 黑客帝国 */
        [data-theme="matrix"] {
            --bg: #000000;
            --panel: rgba(0, 20, 0, 0.8);
            --border: rgba(0, 255, 65, 0.2);
            --accent: #00FF41;
            --text-main: #00FF41;
            --text-dim: #004400;
            --node-bg: #001A00;
            --node-text: #00FF41;
            --shadow: 0 0 15px rgba(0, 255, 65, 0.2);
        }

        /* 5. 奢华黑金 */
        [data-theme="luxury"] {
            --bg: #0D0D0D;
            --panel: #161616;
            --border: rgba(193, 154, 107, 0.3);
            --accent: #C19A6B;
            --text-main: #F0E6D6;
            --text-dim: #5A4A3A;
            --node-bg: #1C1810;
            --node-text: #C19A6B;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        /* 6. 瑞士极简 */
        [data-theme="swiss"] {
            --bg: #FAFAFA;
            --panel: #FFFFFF;
            --border: #E0E0E0;
            --accent: #0051FF;
            --text-main: #111111;
            --text-dim: #AAAAAA;
            --node-bg: #FFFFFF;
            --node-text: #111111;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Noto Sans SC', sans-serif;
            transition: background 0.6s ease, color 0.4s ease;
        }

        /* Glass 主题特殊渐变背景 */
        [data-theme="glass"] body {
            background: linear-gradient(135deg, #1a1c2c 0%, #4a192c 50%, #1a1c2c 100%);
        }

        .polar-grid {
            background-image: radial-gradient(circle, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center;
        }

        .sector-node {
            position: absolute;
            /* transform 由 JS 根据象限动态设置，防止标签溢出 */
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .arc-path {
            fill: none;
            stroke-linecap: round;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 1.8s forwards ease-out;
        }

        @keyframes draw {
            to {
                stroke-dashoffset: 0;
            }
        }

        .hub-ring {
            animation: spin 25s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .glass-blur {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        /* 主题切换按钮 */
        .btn-theme {
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid var(--border);
            color: var(--text-dim);
            background: transparent;
            transition: all 0.25s;
            white-space: nowrap;
        }

        .btn-theme:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        .btn-theme.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        /* 节点标签统一由 CSS 变量决定颜色 */
        .node-label {
            background: var(--node-bg);
            color: var(--node-text);
            border: 1.5px solid var(--accent);
            box-shadow: var(--shadow);
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 17px;
            font-weight: 900;
            /*字体大小*/
            white-space: nowrap;
            line-height: 1.2;
        }

        .node-val {
            font-family: 'JetBrains Mono', monospace;
            /*字体大小*/
            font-size: 15px;
            font-weight: 800;
            margin-top: 3px;
            padding: 1px 6px;
            border-radius: 3px;
            background: var(--panel);
            color: var(--accent);
            border: 1px solid var(--border);
        }
    </style>
</head>

<body class="h-screen w-full flex flex-col overflow-hidden">

    <!-- ===== 顶栏 ===== -->
    <header class="flex-none px-5 py-3 z-50 flex justify-between items-center border-b glass-blur"
        style="border-color: var(--border); background: var(--panel);">
        <div>
            <div class="flex items-center gap-2 mb-0.5">
                <div class="w-1.5 h-1.5 rounded-full"
                    style="background: var(--accent); box-shadow: 0 0 8px var(--accent);"></div>
                <span class="text-[10px] font-mono tracking-[0.3em]" style="color: var(--text-dim);">量化雷达 V5.0</span>
            </div>
            <h1 class="text-xl font-black flex items-center gap-2">
                <span id="page-title">恐慌错杀监测</span>
                <span id="page-index" class="font-mono text-xs opacity-40" style="color: var(--accent);">/01</span>
            </h1>
        </div>

        <!-- 主题选择器 (中文 + flex-wrap 防溢出) -->
        <div class="flex flex-wrap justify-end gap-1.5 max-w-[220px]" id="theme-switcher">
            <button class="btn-theme active" data-theme-name="cyber" onclick="setTheme('cyber')">暗夜</button>
            <button class="btn-theme" data-theme-name="paper" onclick="setTheme('paper')">纸本</button>
            <button class="btn-theme" data-theme-name="glass" onclick="setTheme('glass')">幻彩</button>
            <button class="btn-theme" data-theme-name="matrix" onclick="setTheme('matrix')">黑客</button>
            <button class="btn-theme" data-theme-name="luxury" onclick="setTheme('luxury')">黑金</button>
            <button class="btn-theme" data-theme-name="swiss" onclick="setTheme('swiss')">极简</button>
        </div>
    </header>

    <!-- ===== 主画布 ===== -->
    <main class="flex-1 relative flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 polar-grid opacity-20"></div>

        <!-- 中央核心 -->
        <div class="relative z-20 flex items-center justify-center">
            <!-- 装饰环 -->
            <div class="absolute w-60 h-60 rounded-full opacity-15 hub-ring" style="border: 1px solid var(--accent);">
            </div>
            <div class="absolute w-52 h-52 rounded-full opacity-25 hub-ring"
                style="border-top: 2px solid var(--accent); animation-direction: reverse;"></div>

            <div class="w-40 h-40 rounded-full glass-blur flex flex-col items-center justify-center"
                style="border: 2px solid var(--border); background: var(--panel); box-shadow: var(--shadow);">
                <div class="text-[10px] font-mono tracking-[0.4em] mb-1" style="color: var(--text-dim);">市场情绪</div>
                <div id="central-value" class="text-4xl font-black font-mono tracking-tighter"
                    style="color: var(--accent);">52.4%</div>
                <div class="w-16 h-[3px] mt-3 rounded-full overflow-hidden" style="background: var(--border);">
                    <div id="central-bar" class="h-full rounded-full transition-all duration-1000"
                        style="background: var(--accent); width: 52%;"></div>
                </div>
            </div>
        </div>

        <!-- SVG 轨道层 -->
        <svg id="radial-svg" class="absolute inset-0 w-full h-full z-10" viewBox="0 0 400 400"></svg>
        <!-- 节点层：pointer-events-auto 允许拖拽 -->
        <div id="nodes-container" class="absolute inset-0 z-30" style="overflow:visible;"></div>
    </main>

    <!-- ===== 底栏 ===== -->
    <footer class="flex-none px-6 py-4 z-50 glass-blur"
        style="border-top: 1px solid var(--border); background: var(--panel);">
        <div class="flex justify-around items-center max-w-xs mx-auto">
            <button onclick="switchPage(0)" class="nav-btn group flex flex-col items-center gap-2">
                <div class="w-10 h-[2px] rounded-full transition-all" style="background: var(--border);"></div>
                <span class="text-[11px] font-black tracking-[0.15em]" style="color: var(--text-dim);">策略狙击</span>
            </button>
            <button onclick="switchPage(1)" class="nav-btn group flex flex-col items-center gap-2">
                <div class="w-10 h-[2px] rounded-full transition-all" style="background: var(--border);"></div>
                <span class="text-[11px] font-black tracking-[0.15em]" style="color: var(--text-dim);">核心持仓</span>
            </button>
            <button onclick="switchPage(2)" class="nav-btn group flex flex-col items-center gap-2">
                <div class="w-10 h-[2px] rounded-full transition-all" style="background: var(--border);"></div>
                <span class="text-[11px] font-black tracking-[0.15em]" style="color: var(--text-dim);">避险雷达</span>
            </button>
        </div>
    </footer>

    <script>
        // ===== 真实数据 =====
        const data = [
            {
                title: "恐慌错杀监测", color: "#00F59B", sentiment: "52.4%", items: [
                    { name: "环境治理", val: "-3.11" }, { name: "零售", val: "-2.61" },
                    { name: "教育", val: "-2.37" }, { name: "非金属材料", val: "-1.88" },
                    { name: "塑料制品", val: "-1.14" }, { name: "纺织制造", val: "-1.05" }
                ]
            },
            {
                title: "主力典型洗盘", color: "#40A9FF", sentiment: "48.2%", items: [
                    { name: "电网设备", val: "-0.21" }, { name: "电力", val: "+0.85" },
                    { name: "电源设备", val: "-0.36" }, { name: "自动化设备", val: "+0.50" },
                    { name: "中药", val: "+0.26" }, { name: "IT服务", val: "-0.77" },
                    { name: "军工装备", val: "-0.19" }, { name: "旅游酒店", val: "-0.59" },
                    { name: "消费电子", val: "-0.16" }, { name: "美容护理", val: "+0.38" },
                    { name: "互联网电商", val: "+0.13" }, { name: "轨道交通", val: "-0.69" },
                    { name: "影视院线", val: "+0.99" }, { name: "自动化", val: "+0.55" },
                    { name: "环保设备", val: "+0.09" }
                ]
            },
            {
                title: "诱多陷阱预警", color: "#FF4D6D", sentiment: "35.1%", items: [
                    { name: "电池行业", val: "+1.14" }, { name: "通用设备", val: "+1.37" },
                    { name: "厨卫电器", val: "+2.03" }, { name: "黑色家电", val: "+3.41" },
                    { name: "港口航运", val: "+0.88" }, { name: "软件开发", val: "+2.45" },
                    { name: "医药商业", val: "+1.15" }, { name: "保险", val: "+0.95" }
                ]
            }
        ];

        let currentTheme = 'cyber';

        function setTheme(name) {
            document.body.setAttribute('data-theme', name);
            currentTheme = name;
            document.querySelectorAll('.btn-theme').forEach(b => {
                b.classList.toggle('active', b.dataset.themeName === name);
            });
            const activeIdx = [...document.querySelectorAll('.nav-btn')].findIndex(b => b.dataset.active === 'true');
            switchPage(activeIdx === -1 ? 0 : activeIdx);
        }

        function polar(cx, cy, r, deg) {
            const rad = (deg - 90) * Math.PI / 180;
            return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
        }

        function arcPath(cx, cy, r, startDeg, endDeg) {
            const s = polar(cx, cy, r, endDeg);
            const e = polar(cx, cy, r, startDeg);
            const large = endDeg - startDeg <= 180 ? 0 : 1;
            return `M ${s.x} ${s.y} A ${r} ${r} 0 ${large} 0 ${e.x} ${e.y}`;
        }

        function switchPage(idx) {
            const p = data[idx];
            document.getElementById('page-title').innerText = p.title;
            document.getElementById('page-index').innerText = `/${String(idx + 1).padStart(2, '0')}`;
            document.getElementById('central-value').innerText = p.sentiment;
            document.getElementById('central-value').style.color = p.color;
            document.getElementById('central-bar').style.background = p.color;
            document.getElementById('central-bar').style.width = p.sentiment;

            // 底栏高亮
            document.querySelectorAll('.nav-btn').forEach((btn, i) => {
                const bar = btn.querySelector('div');
                const label = btn.querySelector('span');
                if (i === idx) {
                    btn.dataset.active = 'true';
                    bar.style.background = p.color;
                    bar.style.height = '4px';
                    label.style.color = 'var(--text-main)';
                } else {
                    btn.dataset.active = 'false';
                    bar.style.background = 'var(--border)';
                    bar.style.height = '2px';
                    label.style.color = 'var(--text-dim)';
                }
            });

            // ===== 渲染 =====
            const svg = document.getElementById('radial-svg');
            svg.innerHTML = '';
            const box = document.getElementById('nodes-container');
            box.innerHTML = '';

            const n = p.items.length;
            const angleStep = 360 / n;

            p.items.forEach((item, i) => {
                const angle = angleStep * i;

                // 3层散布，大幅拉开间距 (FIX #5)
                const layer = i % 3;
                const dist = 90 + layer * 40;

                // 弧线加宽到 30 度跨度 (FIX #8)
                const halfArc = 12;
                const arc = document.createElementNS("http://www.w3.org/2000/svg", "path");
                arc.setAttribute("d", arcPath(200, 200, dist, angle - halfArc, angle + halfArc));
                arc.setAttribute("class", "arc-path");
                arc.setAttribute("stroke", p.color);
                arc.setAttribute("stroke-width", Math.max(2, Math.min(12, Math.abs(parseFloat(item.val)) * 4)));
                arc.setAttribute("opacity", "0.5");
                svg.appendChild(arc);

                // 节点定位：保持精确的极坐标位置不变
                const pos = polar(50, 50, dist / 3.5, angle);
                const node = document.createElement('div');
                node.className = 'sector-node pointer-events-auto';

                // ======= 自动缓存恢复逻辑 =======
                const storageKey = `pos_${currentTheme}_${p.title}_${item.name}`;
                const savedPos = localStorage.getItem(storageKey);
                
                if (savedPos) {
                    const { left, top } = JSON.parse(savedPos);
                    node.style.left = left;
                    node.style.top = top;
                } else {
                    node.style.left = `${pos.x}%`;
                    node.style.top = `${pos.y}%`;
                }

                // 根据象限动态设置标签的"生长方向"
                // 原理：标签不再硬居中（translate -50% -50%），
                // 而是根据节点处于屏幕哪一侧，让标签朝屏幕中心方向展开
                const isLeft = pos.x < 38;
                const isRight = pos.x > 62;
                const isTop = pos.y < 30;
                const isBot = pos.y > 70;

                const tx = isLeft ? '0%' : isRight ? '-100%' : '-50%';
                const ty = isTop ? '0%' : isBot ? '-100%' : '-50%';
                node.style.transform = `translate(${tx}, ${ty})`;

                const alignDir = isLeft ? 'flex-start' : isRight ? 'flex-end' : 'center';
                const textAlign = isLeft ? 'left' : isRight ? 'right' : 'center';

                // 恢复两行独立布局，套一层容器控制对齐和拖动光标
                node.innerHTML = `
                    <div style="display:flex;flex-direction:column;align-items:${alignDir};cursor:grab;user-select:none;">
                        <div class="node-label" style="text-align:${textAlign}">${item.name}</div>
                        <div class="node-val" style="text-align:${textAlign}">${item.val}</div>
                    </div>
                `;
                box.appendChild(node);
                makeDraggable(node);  // 绑定拖拽
            });

            // 碰撞推移已移除，改为用户手动拖拽调整
        }

        // === 拖拽功能 ===
        function makeDraggable(el, storageKey) {
            let dragging = false;
            let startX, startY, origLeft, origTop;

            function getClient(e) {
                return e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY }
                                 : { x: e.clientX, y: e.clientY };
            }

            function onStart(e) {
                dragging = true;
                const c = getClient(e);
                startX = c.x;
                startY = c.y;
                origLeft = parseFloat(el.style.left);
                origTop  = parseFloat(el.style.top);
                el.style.cursor = 'grabbing';
                el.style.zIndex = 1000; // 拖拽时置顶
                e.preventDefault();
            }

            function onMove(e) {
                if (!dragging) return;
                const c = getClient(e);
                const dx = (c.x - startX) / window.innerWidth  * 100;
                const dy = (c.y - startY) / window.innerHeight * 100;
                el.style.left = `${origLeft + dx}%`;
                el.style.top  = `${origTop  + dy}%`;
            }

            function onEnd() {
                if (!dragging) return;
                dragging = false;
                el.style.cursor = 'grab';
                el.style.zIndex = '';
                
                // 保存位置到 localStorage
                localStorage.setItem(storageKey, JSON.stringify({
                    left: el.style.left,
                    top: el.style.top
                }));
            }

            // 鼠标事件
            el.addEventListener('mousedown',  onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup',   onEnd);
            // 触屏事件
            el.addEventListener('touchstart', onStart, { passive: false });
            window.addEventListener('touchmove',  onMove, { passive: false });
            window.addEventListener('touchend',   onEnd);
        }

        // 初始化
        setTheme('cyber');
    </script>
</body>

</html>
