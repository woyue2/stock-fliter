<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A*B*C 多行策略计算器</title>
  <style>
    :root { --bg:#f8fafc; --card:#ffffff; --text:#2d3748; --muted:#718096; --line:#e2e8f0; --brand:#2b6cb0; --ok:#2c7a7b; --warn:#9c4221; --bad:#c53030; }
    * { box-sizing: border-box; }
    body { margin:0; padding:24px; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
    .card { max-width: 1200px; margin:0 auto; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; box-shadow:0 6px 20px rgba(0,0,0,0.05); }
    h1 { margin:0 0 6px 0; font-size:22px; }
    .sub { color:var(--muted); font-size:13px; margin-bottom:12px; }
    .actions { margin-bottom:10px; display:flex; gap:8px; }
    button { padding:8px 12px; background:var(--brand); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:14px; }
    table { width:100%; border-collapse:collapse; }
    th,td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
    input { width: 110px; padding:8px 8px; border:1px solid var(--line); border-radius:6px; font-size:14px; }
    .ok { color:var(--ok); font-weight:600; }
    .warn { color:var(--warn); font-weight:600; }
    .bad { color:var(--bad); font-weight:600; }
    .hint { font-size:12px; color:var(--muted); margin-left:6px; }
    @media (max-width:900px){ input{width:90px} }
    @media (max-width:720px){ input{width:78px} th,td{font-size:12px} }
  </style>
  <link rel="preload" href="./calculator.js" as="script">
  <link rel="prefetch" href="./calculator.js">
  <meta http-equiv="Cache-Control" content="no-store" />
</head>
<body>
  <div class="card">
    <h1>A*B*C 多行策略计算器</h1>
    <div class="sub">同一行输入，支持新增多行；适合批量评估多个板块/行业的 A、B、C 与预期。</div>
    <div class="actions">
      <button id="addRow">新增一行</button>
      <button id="calcAll">全部计算</button>
      <span class="hint">单位自洽即可（主力净额与成交额保持同单位）</span>
    </div>
    <table id="calcTable">
      <thead>
        <tr>
          <th>成交额</th>
          <th>主力净额</th>
          <th>散户净额</th>
          <th>当前涨幅(%)</th>
          <th>主力强度A</th>
          <th>主力行为B</th>
          <th>资金效率C</th>
          <th>博弈预期</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <script src="./calculator.js"></script>
</body>
</html>
