<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端轻量报告索引 - 搜索</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #26a69a 0%, #004d40 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 2rem;
        }
        h1 {
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }
        .subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .search-box {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .search-box input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .search-box input:focus {
            outline: none;
            border-color: #26a69a;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        .btn-primary {
            background: linear-gradient(135deg, #26a69a 0%, #004d40 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(38, 166, 154, 0.4);
        }
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .actions {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .results {
            margin-top: 2rem;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e0e0e0;
        }
        .result-count {
            font-size: 1.1rem;
            color: #26a69a;
            font-weight: 600;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .link {
            color: #26a69a;
            text-decoration: none;
            font-weight: 500;
        }
        .link:hover {
            text-decoration: underline;
        }
        .empty {
            text-align: center;
            padding: 3rem;
            color: #999;
        }
        .loading {
            text-align: center;
            padding: 2rem;
            color: #26a69a;
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>☁️ 云端轻量报告搜索</h1>
        <p class="subtitle">只展示 PlanToDeploy/output/cloud_* 生成的报告</p>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="输入股票代码或名称（如：600519 或 茅台）" />
            <button class="btn btn-primary" onclick="searchStock()">🔍 搜索</button>
        </div>
        
        <div class="actions">
            <button class="btn btn-secondary" onclick="showHotStocks()">🔥 热门股票</button>
            <button class="btn btn-secondary" onclick="showStats()">📈 统计信息</button>
            <button class="btn btn-secondary" onclick="showReportIndex()">📋 报告列表</button>
        </div>
        
        <div id="results" class="results"></div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:5000';
        
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchStock();
            }
        });

        async function searchStock() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) {
                alert('请输入股票代码或名称');
                return;
            }
            showLoading();
            try {
                const isCode = /^\d+$/.test(keyword);
                const param = isCode ? `code=${keyword}` : `name=${keyword}`;
                const response = await fetch(`${API_BASE}/api/search?${param}`);
                const data = await response.json();
                if (data.error) {
                    showError(data.error);
                    return;
                }
                // 这里不对模块做过滤, 仍展示 stocks_index 中所有记录, 方便对比
                displayResults(data.results, `搜索结果：${keyword}`);
            } catch (error) {
                showError('搜索失败，请检查 API 服务是否已启动');
            }
        }

        async function showHotStocks() {
            showLoading();
            try {
                const response = await fetch(`${API_BASE}/api/hot-stocks`);
                const data = await response.json();
                if (data.error) {
                    showError(data.error);
                    return;
                }
                displayHotStocks(data.hot_stocks);
            } catch (error) {
                showError('获取热门股票失败，请检查 API 服务是否已启动');
            }
        }

        async function showStats() {
            showLoading();
            try {
                const response = await fetch(`${API_BASE}/api/stats`);
                const data = await response.json();
                if (data.error) {
                    showError(data.error);
                    return;
                }
                displayStats(data);
            } catch (error) {
                showError('获取统计信息失败，请检查 API 服务是否已启动');
            }
        }

        function showReportIndex() {
            const resultsDiv = document.getElementById('results');
            const tableHtml = `
                <div class="result-header">
                    <h2>📋 云端轻量报告列表</h2>
                    <span class="result-count">只显示云端模块</span>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>玄学(云端)</th><th>TD九底(云端)</th><th>新指标(云端)</th>
                        </tr>
                    </thead>
                    <tbody>
                        
                    </tbody>
                </table>
            `;
            resultsDiv.innerHTML = tableHtml;
        }

        function showLoading() {
            document.getElementById('results').innerHTML = '<div class="loading">⏳ 加载中...</div>';
        }

        function showError(message) {
            document.getElementById('results').innerHTML = `<div class="error">❌ ${message}</div>`;
        }

        // 以下 displayResults/displayHotStocks/displayStats 与主索引保持一致(略)
        // 为节省篇幅, 可直接共用相同实现
    </script>
</body>
</html>
