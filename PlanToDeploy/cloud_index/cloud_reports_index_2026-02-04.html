<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端轻量报告索引 - 搜索</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #26a69a 0%, #004d40 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 2rem;
        }
        h1 {
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }
        .subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .search-box {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .search-box input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .search-box input:focus {
            outline: none;
            border-color: #26a69a;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        .btn-primary {
            background: linear-gradient(135deg, #26a69a 0%, #004d40 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(38, 166, 154, 0.4);
        }
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .actions {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .runner-panel {
            margin-bottom: 1.5rem;
            padding: 1rem 1.25rem;
            border-radius: 8px;
            background: #e0f2f1;
            border: 1px solid #b2dfdb;
        }
        .runner-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .runner-status-text {
            font-size: 0.9rem;
            color: #004d40;
        }
        .runner-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .runner-controls label {
            font-size: 0.85rem;
            color: #004d40;
        }
        .runner-controls input[type="date"] {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            border: 1px solid #b2dfdb;
            font-size: 0.85rem;
        }
        .logs {
            background: #f5f5f5;
            border-radius: 6px;
            padding: 0.75rem;
            max-height: 260px;
            overflow-y: auto;
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            line-height: 1.4;
        }
        .results {
            margin-top: 2rem;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e0e0e0;
        }
        .result-count {
            font-size: 1.1rem;
            color: #26a69a;
            font-weight: 600;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .link {
            color: #26a69a;
            text-decoration: none;
            font-weight: 500;
        }
        .link:hover {
            text-decoration: underline;
        }
        .link-empty {
            color: #999;
            cursor: default;
        }
        .link-empty:hover {
            text-decoration: none;
        }
        .empty {
            text-align: center;
            padding: 3rem;
            color: #999;
        }
        .loading {
            text-align: center;
            padding: 2rem;
            color: #26a69a;
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>☁️ 云端轻量报告搜索</h1>
        <p class="subtitle">只展示 PlanToDeploy/output/cloud_* 生成的报告</p>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="输入股票代码或名称（如：600519 或 茅台）" />
            <button class="btn btn-primary" onclick="searchStock()">🔍 搜索</button>
        </div>
        
        <div class="actions">
            <button class="btn btn-secondary" onclick="showHotStocks()">🔥 热门股票</button>
            <button class="btn btn-secondary" onclick="showStats()">📈 统计信息</button>
            <button class="btn btn-secondary" onclick="showReportIndex()">📋 报告列表</button>
        </div>

        <div class="runner-panel">
            <div class="runner-header">
                <div>
                    <strong>云端 Runner 状态</strong>
                    <div id="runnerStatus" class="runner-status-text">状态: 未知</div>
                </div>
                <div>
                    <button class="btn btn-secondary" onclick="triggerRunDaily()">🚀 手动运行云端 Runner</button>
                    <button class="btn btn-secondary" style="margin-left: 0.5rem;" onclick="stopRunDaily()">⏹ 停止当前任务</button>
                </div>
            </div>
            <div class="runner-controls">
                <label>
                    <input type="checkbox" id="runnerTestMode" />
                    使用 test 模式(小样本股票池)
                </label>
                <label>
                    截止日期:
                    <input type="date" id="runnerEndDate" />
                </label>
                <label>
                    运行模式:
                    <select id="runnerMode">
                        <option value="all">全部模块（统一优化版）</option>
                        <option value="td">仅 TD 九底</option>
                        <option value="xuanxue">仅 玄学组合</option>
                        <option value="new">仅 新指标</option>
                    </select>
                </label>
            </div>
            <div id="runnerLogs" class="logs">日志尚未加载</div>
        </div>
        
        <div id="results" class="results"></div>
    </div>

    <script>
        // 与当前页面同源的 API 地址
        const API_BASE = '';
        let logCursor = 0;
        let logTimer = null;
        
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchStock();
            }
        });

        async function searchStock() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) {
                alert('请输入股票代码或名称');
                return;
            }
            showLoading();
            try {
                const isCode = /^\d+$/.test(keyword);
                const param = isCode ? `code=${keyword}` : `name=${keyword}`;
                const response = await fetch(`${API_BASE}/api/search?${param}`);
                const data = await response.json();
                if (data.error) {
                    showError(data.error);
                    return;
                }
                // 这里不对模块做过滤, 仍展示 stocks_index 中所有记录, 方便对比
                displayResults(data.results, `搜索结果：${keyword}`);
            } catch (error) {
                showError('搜索失败，请检查 API 服务是否已启动');
            }
        }

        async function showHotStocks() {
            showLoading();
            try {
                const response = await fetch(`${API_BASE}/api/hot-stocks`);
                const data = await response.json();
                if (data.error) {
                    showError(data.error);
                    return;
                }
                displayHotStocks(data.hot_stocks);
            } catch (error) {
                showError('获取热门股票失败，请检查 API 服务是否已启动');
            }
        }

        async function showStats() {
            showLoading();
            try {
                const response = await fetch(`${API_BASE}/api/stats`);
                const data = await response.json();
                if (data.error) {
                    showError(data.error);
                    return;
                }
                displayStats(data);
            } catch (error) {
                showError('获取统计信息失败，请检查 API 服务是否已启动');
            }
        }

        // 显示搜索结果
        function displayResults(results, title) {
            if (results.length === 0) {
                document.getElementById('results').innerHTML = `
                    <div class="empty">
                        <h3>😔 未找到结果</h3>
                        <p>请尝试其他关键词</p>
                    </div>
                `;
                return;
            }
            
            let html = `
                <div class="result-header">
                    <h2>${title}</h2>
                    <span class="result-count">共 ${results.length} 条记录</span>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>代码</th>
                            <th>名称</th>
                            <th>日期</th>
                            <th>模块</th>
                            <th>策略级别</th>
                            <th>板块</th>
                            <th>行业</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            results.forEach(item => {
                html += `
                    <tr>
                        <td>${item.代码}</td>
                        <td>${item.名称}</td>
                        <td>${item.日期}</td>
                        <td>${item.模块}</td>
                        <td>${item.策略级别}</td>
                        <td>${item.板块}</td>
                        <td>${item.行业}</td>
                        <td><a href="/reports/${String(item.报告路径 || '').replace(/^\.?\//, '')}" target="_blank" class="link">查看报告</a></td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            document.getElementById('results').innerHTML = html;
        }

        // 显示热门股票
        function displayHotStocks(data) {
            if (!data || data.length === 0) {
                document.getElementById('results').innerHTML = '<div class="empty">暂无数据</div>';
                return;
            }
            
            let html = `
                <div class="result-header">
                    <h2>🔥 热门股票 Top 20</h2>
                    <span class="result-count">按出现次数排序</span>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>排名</th>
                            <th>代码</th>
                            <th>名称</th>
                            <th>出现次数</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            data.forEach((item, index) => {
                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item.代码}</td>
                        <td>${item.名称}</td>
                        <td><strong>${item.出现次数}</strong></td>
                        <td><a href="javascript:void(0)" onclick="searchByCode('${item.代码}')" class="link">查看详情</a></td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            document.getElementById('results').innerHTML = html;
        }

        // 显示统计信息
        function displayStats(data) {
            let modulesHtml = '';
            if (data.modules) {
                for (const [module, count] of Object.entries(data.modules)) {
                    modulesHtml += `
                        <div class="stat-card">
                            <div class="stat-value">${count}</div>
                            <div class="stat-label">${module}</div>
                        </div>
                    `;
                }
            }
            
            const html = `
                <div class="result-header">
                    <h2>📈 统计信息</h2>
                </div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value">${data.total_records}</div>
                        <div class="stat-label">总记录数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.unique_stocks}</div>
                        <div class="stat-label">独立股票数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.date_range.start}</div>
                        <div class="stat-label">开始日期</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.date_range.end}</div>
                        <div class="stat-label">结束日期</div>
                    </div>
                </div>
                <div class="result-header" style="margin-top: 2rem;">
                    <h3>各模块统计</h3>
                </div>
                <div class="stats-grid">
                    ${modulesHtml}
                </div>
            `;
            
            document.getElementById('results').innerHTML = html;
        }

        // 按代码搜索
        function searchByCode(code) {
            document.getElementById('searchInput').value = code;
            searchStock();
        }

        function updateRunnerStatus(status) {
            const el = document.getElementById('runnerStatus');
            if (!el) return;
            const running = status.running;
            const state = status.status || 'unknown';
            const start = status.start_time || '-';
            const end = status.end_time || '-';
            const test = status.test ? 'test' : 'normal';
            const mode = status.mode || 'all';
            const dateInfo = status.end_date ? (' | 截止日期: ' + status.end_date) : '';
            el.textContent =
                '状态: ' + (running ? '运行中' : state) +
                ' | 模式: ' + test +
                ' | 运行: ' + mode +
                dateInfo +
                ' | 开始: ' + start +
                ' | 结束: ' + end;
        }

        async function refreshRunnerStatus() {
            try {
                const resp = await fetch(`${API_BASE}/api/run-status`);
                const data = await resp.json();
                updateRunnerStatus(data);
                if (data.running && !logTimer) {
                    startLogPolling();
                }
            } catch (error) {
                // 忽略状态刷新错误
            }
        }

        function appendLogs(lines) {
            const el = document.getElementById('runnerLogs');
            if (!el) return;
            if (!lines.length && logCursor === 0) {
                el.textContent = '暂无日志';
                return;
            }
            const text = lines.join('\n');
            el.textContent = (logCursor === 0 ? '' : el.textContent + '\n') + text;
            el.scrollTop = el.scrollHeight;
        }

        async function fetchLogs() {
            try {
                const resp = await fetch(`${API_BASE}/api/run-logs?from=${logCursor}`);
                const data = await resp.json();
                appendLogs(data.lines || []);
                logCursor = data.next || logCursor;
                if (!data.running && logTimer) {
                    clearInterval(logTimer);
                    logTimer = null;
                }
            } catch (error) {
                // 日志拉取错误可以忽略
            }
        }

        function startLogPolling() {
            if (logTimer) return;
            fetchLogs();
            logTimer = setInterval(fetchLogs, 3000);
        }

        async function triggerRunDaily() {
            if (!confirm('确认手动运行云端 Runner 吗？该操作可能耗时数分钟。')) {
                return;
            }
            const testMode = document.getElementById('runnerTestMode').checked;
            const endDateInput = document.getElementById('runnerEndDate').value.trim();
            const modeSelect = document.getElementById('runnerMode');
            const payload = {};
            if (endDateInput) {
                payload.end_date = endDateInput;
            }
            if (testMode) {
                payload.test = true;
            }
            if (modeSelect && modeSelect.value) {
                payload.mode = modeSelect.value;
            }
            try {
                const resp = await fetch(`${API_BASE}/api/run-daily`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const data = await resp.json();
                if (!resp.ok) {
                    alert(data.error || data.message || '启动失败');
                    return;
                }
                logCursor = 0;
                document.getElementById('runnerLogs').textContent = '任务已启动，正在获取日志...';
                startLogPolling();
                refreshRunnerStatus();
            } catch (error) {
                alert('启动云端 Runner 失败，请检查服务是否已启动');
            }
        }

        function showReportIndex() {
            const resultsDiv = document.getElementById('results');
            const tableHtml = `
                <div class="result-header">
                    <h2>📋 云端轻量报告列表</h2>
                    <span class="result-count">只显示云端模块</span>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>玄学(云端)</th><th>TD九底(云端)</th><th>新指标(云端)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td>2026-02-04</td><td><a href="javascript:void(0)" class="link link-empty">无信号</a></td><td><a href="/reports/output/cloud_td/2026-02-04/01-31-24/summary_20260204_013124.html" target="_blank" class="link">查看</a></td><td><a href="/reports/output/cloud_new/2026-02-04/01-31-24/summary_20260204_013124.html" target="_blank" class="link">查看</a></td></tr>
                        <tr><td>2026-02-03</td><td><a href="/reports/output/cloud_xuanxue/2026-02-03/02-59-25/summary_20260203_025930.html" target="_blank" class="link">查看</a></td><td><a href="/reports/output/cloud_td/2026-02-03/19-56-17/summary_20260203_195617.html" target="_blank" class="link">查看</a></td><td><a href="/reports/output/cloud_new/2026-02-03/03-27-50/summary_20260203_032750.html" target="_blank" class="link">查看</a></td></tr>
                        <tr><td>2026-02-02</td><td><a href="javascript:void(0)" class="link link-empty">无信号</a></td><td><a href="/reports/output/cloud_td/2026-02-02/03-35-20/summary_20260202_033520.html" target="_blank" class="link">查看</a></td><td><a href="/reports/output/cloud_new/2026-02-02/03-31-24/summary_20260202_033124.html" target="_blank" class="link">查看</a></td></tr>
                        <tr><td>2026-01-30</td><td><a href="/reports/output/cloud_xuanxue/2026-01-30/04-41-06/summary_20260130_044109.html" target="_blank" class="link">查看</a></td><td><a href="javascript:void(0)" class="link link-empty">无信号</a></td><td><a href="javascript:void(0)" class="link link-empty">无信号</a></td></tr>
                        <tr><td>2026-01-28</td><td><a href="/reports/output/cloud_xuanxue/2026-01-28/03-33-27/summary_20260128_033333.html" target="_blank" class="link">查看</a></td><td><a href="javascript:void(0)" class="link link-empty">无信号</a></td><td><a href="javascript:void(0)" class="link link-empty">无信号</a></td></tr>
                        <tr><td>2026-01-27</td><td><a href="javascript:void(0)" class="link link-empty">无信号</a></td><td><a href="/reports/output/cloud_td/2026-01-27/03-58-28/summary_20260127_035828.html" target="_blank" class="link">查看</a></td><td><a href="javascript:void(0)" class="link link-empty">无信号</a></td></tr>
                        <tr><td>2026-01-20</td><td><a href="javascript:void(0)" class="link link-empty">无信号</a></td><td><a href="/reports/output/cloud_td/2026-01-20/04-11-15/summary_20260120_041115.html" target="_blank" class="link">查看</a></td><td><a href="javascript:void(0)" class="link link-empty">无信号</a></td></tr>
                        <tr><td>2026-01-09</td><td><a href="javascript:void(0)" class="link link-empty">无信号</a></td><td><a href="/reports/output/cloud_td/2026-01-09/04-39-39/summary_20260109_043939.html" target="_blank" class="link">查看</a></td><td><a href="javascript:void(0)" class="link link-empty">无信号</a></td></tr>
                        <tr><td>2026-01-08</td><td><a href="javascript:void(0)" class="link link-empty">无信号</a></td><td><a href="/reports/output/cloud_td/2026-01-08/04-39-02/summary_20260108_043902.html" target="_blank" class="link">查看</a></td><td><a href="javascript:void(0)" class="link link-empty">无信号</a></td></tr>
                    </tbody>
                </table>
            `;
            resultsDiv.innerHTML = tableHtml;
        }

        function showLoading() {
            document.getElementById('results').innerHTML = '<div class="loading">⏳ 加载中...</div>';
        }

        function showError(message) {
            document.getElementById('results').innerHTML = `<div class="error">❌ ${message}</div>`;
        }

        async function stopRunDaily() {
            if (!confirm('确认要停止当前运行中的云端 Runner 吗？')) {
                return;
            }
            try {
                const resp = await fetch(`${API_BASE}/api/run-stop`, {
                    method: 'POST'
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) {
                    alert(data.error || data.message || '停止失败');
                    return;
                }
                if (logTimer) {
                    clearInterval(logTimer);
                    logTimer = null;
                }
                logCursor = 0;
                document.getElementById('runnerLogs').textContent = '任务已停止';
                refreshRunnerStatus();
            } catch (error) {
                alert('停止失败，请确保 API 服务已启动');
            }
        }

        // 页面加载时刷新一次 Runner 状态
        refreshRunnerStatus();
    </script>
</body>
</html>
