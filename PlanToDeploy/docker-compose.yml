version: "3.9"

services:
  stock-cloud:
    build: .
    container_name: stock-cloud
    ports:
      - "5000:5000"
    volumes:
      - ./:/app
    environment:
      # 使用 PlanToDeploy 内部的 api_server 作为入口
      API_APP_MODULE: "api_server:app"
      # 启用每日自动运行（晚上8点）
      AUTO_RUN_ENABLED: "1"
      AUTO_RUN_HOUR: "13" # 服务器有时差，13+6=19 晚上7点爬
      AUTO_RUN_MINUTE: "0"
      AUTO_RUN_MODE: "all"  # 运行模式: all/td/xuanxue/new

