version: "3.9"

services:
  stock-cloud:
    build: .
    container_name: stock-cloud
    ports:
      - "5000:5000"
    volumes:
      # 将当前项目挂载到容器 /app，便于本地测试时共享 PlanToDeploy 输出与索引
      - ./:/app
    environment:
      # 使用云端版 Flask 应用 (PlanToDeploy/api_server.py)
      API_APP_MODULE: "PlanToDeploy.api_server:app"
      # 启用每日自动运行 Runner（时间为容器本地时间）
      AUTO_RUN_ENABLED: "1"
      # 北京时间晚 8 点(20:00)
      AUTO_RUN_HOUR: "20"
      AUTO_RUN_MINUTE: "0"
      # AUTO_RUN_MODE 可选: all/daily/xuanxue/new，默认 all
      # AUTO_RUN_MODE: "all"

  stock-cloud-runner:
    build: .
    container_name: stock-cloud-runner
    depends_on:
      - stock-cloud
    volumes:
      - ./:/app
    # 本地测试用：在容器内跑一遍云端轻量 Runner 全流程（小样本）
    command: >
      sh -c "cd /app/PlanToDeploy &&
             python stream_run_daily.py --test --limit 20 --days 180 &&
             python cloud_xuanxue_stream_runner.py --test --limit 20 --days 365 &&
             python cloud_new_stream_runner.py --test --limit 20 --days 365 &&
             python scripts/build_reports_index.py"
